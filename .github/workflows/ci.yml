name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The gsd-tools stub the smoke test needs now ships inside the test
      # itself, so a laptop and a runner exercise the same resolution path
      # instead of the runner-only one this step used to create.
      - name: session-start smoke test
        run: bash tests/test-session-start.sh

      # Self-contained: every case builds its own git repos, bare origin and
      # stub gsd-tools under mktemp -d, so the runner's own shallow checkout
      # (whose HEAD is not reachable from origin/main) is never the subject.
      - name: capability auto-install guard test
        run: bash tests/test-capability-auto-install.sh

      - name: capability install test
        run: bash tests/test-capability-install.sh

      - name: gate script resolution test
        run: bash tests/test-gate-script-resolution.sh

      - name: alternatives-checker unit test
        run: python3 -m unittest discover -s tests
